[project]
name = "event-booking"
version = "0.1.0"
description = "Backend Tutorial Project"
readme = "README.md"
authors = [
    { name = "max-dv800", email = "m.dvornikov86@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aio-pika>=10.1.0",
    "aiodocker>=0.27.0",
    "alembic>=1.20.0",
    "amqp>=5.4.0",
    "argon2-cffi>=25.1.0",
    "asgiref>=3.12.1",
    "asyncpg>=0.31.0",
    "black>=26.10.1",
    "celery>=5.6.3",
    "fastapi>=0.141.1",
    "httpie>=3.2.4",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "kombu>=5.6.2",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.13.5",
    "pyjwt>=2.14.0",
    "pytest-asyncio>=1.4.0",
    "pytest-celery>=1.3.0",
    "pytest-cov>=7.1.0",
    "pytest-dotenv>=0.5.2",
    "pytest-order>=1.5.0",
    "python-multipart>=0.0.32",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.0.54",
    "uvicorn>=0.53.0",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false

